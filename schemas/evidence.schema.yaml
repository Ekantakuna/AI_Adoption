$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:ai-adoption:schema:evidence:1"
title: Atomic evidence statement
type: object
additionalProperties: false
required: [id, type, statement, source_id, source_locator, processing_run_id, confidence, classification, review_status, origin, created_at, created_by]
properties:
  id: {type: string, pattern: "^EVID-[0-9]{6}$"}
  type: {const: evidence_statement}
  statement: {type: string, minLength: 1}
  source_id: {type: string, pattern: "^SRC-[A-Z0-9]+-[0-9]{6}$"}
  source_locator: {type: string, minLength: 1}
  processing_run_id: {type: string, pattern: "^RUN-[0-9]{6}$"}
  confidence: {enum: [low, medium, high]}
  classification: {enum: [public, internal, restricted]}
  review_status: {enum: [draft, needs_review, under_review, verified, approved, rejected, deprecated]}
  origin: {enum: [human, ai]}
  created_at: {type: string, format: date}
  created_by: {type: string, minLength: 1}
  reviewer: {$ref: "#/$defs/reviewer"}
  notes: {type: string}
allOf:
  - if: {properties: {review_status: {enum: [verified, approved]}}, required: [review_status]}
    then: {required: [reviewer]}
$defs:
  reviewer:
    type: object
    additionalProperties: false
    required: [name, reviewed_at]
    properties:
      name: {type: string, minLength: 1}
      reviewed_at: {type: string, format: date}
