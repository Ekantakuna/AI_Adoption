$schema: https://json-schema.org/draft/2020-12/schema
$id: critical-success-factor.schema.yaml
title: Critical success factor
description: Condition required for successful strategy execution with measurable evidence.
type: object
additionalProperties: false
required: [critical_success_factor_id, ai_strategy_id, name, category_id, status, statement, rationale, strategic_objective_ids, capability_ids, prerequisite_domain_ids, owner_stakeholder_ids, leading_indicator_ids, outcome_metric_ids, evidence_requirements, current_status, signal, review_frequency, source_ids, evidence_refs, assumptions, classification, reviewed_by, reviewed_at]
properties:
  critical_success_factor_id: {type: string, pattern: "^CSF-[0-9]{6}$"}
  ai_strategy_id: {type: string, pattern: "^AISTRAT-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  category_id: {$ref: "#/$defs/id"}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, achieved, at_risk, failed, superseded]}
  statement: {type: string}
  rationale: {type: string}
  strategic_objective_ids: {$ref: "#/$defs/records"}
  capability_ids: {$ref: "#/$defs/records"}
  prerequisite_domain_ids: {$ref: "#/$defs/ids"}
  owner_stakeholder_ids: {$ref: "#/$defs/records"}
  leading_indicator_ids: {$ref: "#/$defs/metrics_required"}
  outcome_metric_ids: {$ref: "#/$defs/records"}
  evidence_requirements: {$ref: "#/$defs/text"}
  current_status: {type: string}
  signal: {type: string, enum: [on_track, watch, intervene, stop_or_rethink, not_assessed]}
  review_frequency: {type: string}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  assumptions: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  ids: {type: array, uniqueItems: true, items: {$ref: "#/$defs/id"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  metrics_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^MET-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
