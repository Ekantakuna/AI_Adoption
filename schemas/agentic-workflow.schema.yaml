$schema: https://json-schema.org/draft/2020-12/schema
$id: agentic-workflow.schema.yaml
title: Agentic workflow
type: object
additionalProperties: false
required: [agentic_workflow_id, name, workflow_scope, version, status, purpose, trigger, inputs, steps, outputs, agent_profile_ids, accountable_role_ids, authority_rule_ids, human_gates, escalation_and_override, prohibited_actions, evidence_requirements, metric_ids, risk_ids, control_ids, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  agentic_workflow_id: {type: string, pattern: "^AWF-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  workflow_scope: {$ref: "#/$defs/id"}
  version: {type: string}
  status: {$ref: "#/$defs/status"}
  purpose: {type: string}
  trigger: {type: string}
  inputs: {$ref: "#/$defs/text"}
  steps: {type: array, items: {$ref: "#/$defs/step"}}
  outputs: {$ref: "#/$defs/text"}
  agent_profile_ids: {$ref: "#/$defs/records"}
  accountable_role_ids: {$ref: "#/$defs/records"}
  authority_rule_ids: {$ref: "#/$defs/records"}
  human_gates: {$ref: "#/$defs/text"}
  escalation_and_override: {$ref: "#/$defs/text"}
  prohibited_actions: {$ref: "#/$defs/text"}
  evidence_requirements: {$ref: "#/$defs/text"}
  metric_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  step:
    type: object
    additionalProperties: false
    required: [step_id, name, mode, agent_profile_ids, input_refs, output_refs, human_gate_type]
    properties:
      step_id: {$ref: "#/$defs/id"}
      name: {type: string}
      mode: {$ref: "#/$defs/id"}
      agent_profile_ids: {$ref: "#/$defs/records"}
      input_refs: {$ref: "#/$defs/text"}
      output_refs: {$ref: "#/$defs/text"}
      human_gate_type: {type: [string, "null"]}
  id: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, suspended, superseded, retired]}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
