$schema: https://json-schema.org/draft/2020-12/schema
$id: governance-role.schema.yaml
title: Governance role or body
description: Governance role, cross-functional board, committee or forum.
type: object
additionalProperties: false
required: [governance_role_id, name, body_type, status, purpose, mandate, governance_domain_ids, governance_layer_ids, accountability_scope, responsibilities, decision_rights, membership_role_ids, chair_role_id, escalation_to_ids, cadence, quorum_or_approval_rules, capability_ids, artifact_ids, source_ids, evidence_refs, classification]
properties:
  governance_role_id: {type: string, pattern: "^GROLE-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  body_type: {$ref: "#/$defs/id"}
  status: {$ref: "#/$defs/status"}
  purpose: {type: string}
  mandate: {type: string}
  governance_domain_ids: {$ref: "#/$defs/ids"}
  governance_layer_ids: {$ref: "#/$defs/ids"}
  accountability_scope: {$ref: "#/$defs/text"}
  responsibilities: {$ref: "#/$defs/text"}
  decision_rights: {$ref: "#/$defs/text"}
  membership_role_ids: {$ref: "#/$defs/record_ids"}
  chair_role_id: {type: [string, "null"], pattern: "^GROLE-[0-9]{6}$"}
  escalation_to_ids: {$ref: "#/$defs/record_ids"}
  cadence: {type: [string, "null"]}
  quorum_or_approval_rules: {$ref: "#/$defs/text"}
  capability_ids: {$ref: "#/$defs/record_ids"}
  artifact_ids: {$ref: "#/$defs/record_ids"}
  source_ids: {$ref: "#/$defs/source_ids"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
$defs:
  id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  status: {type: string, enum: [proposed, draft, in_review, approved, superseded, retired]}
  ids: {type: array, uniqueItems: true, items: {$ref: "#/$defs/id"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  record_ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  source_ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
