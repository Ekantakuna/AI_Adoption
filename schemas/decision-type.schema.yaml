$schema: https://json-schema.org/draft/2020-12/schema
$id: decision-type.schema.yaml
title: Decision type
description: Reusable class of business decision and its operating characteristics.
type: object
additionalProperties: false
required: [decision_type_id, name, category, status, description, decision_question_template, business_domain_ids, cadence, materiality, trigger_conditions, intended_outcomes, choice_architecture_ids, authority_rule_ids, metric_ids, risk_ids, control_ids, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  decision_type_id: {type: string, pattern: "^DTYPE-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  category: {$ref: "#/$defs/id"}
  status: {$ref: "#/$defs/status"}
  description: {type: string}
  decision_question_template: {type: string}
  business_domain_ids: {$ref: "#/$defs/ids"}
  cadence: {$ref: "#/$defs/id"}
  materiality: {$ref: "#/$defs/id"}
  trigger_conditions: {$ref: "#/$defs/text"}
  intended_outcomes: {$ref: "#/$defs/text"}
  choice_architecture_ids: {$ref: "#/$defs/records"}
  authority_rule_ids: {$ref: "#/$defs/records"}
  metric_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  ids: {type: array, uniqueItems: true, items: {$ref: "#/$defs/id"}}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, superseded, retired]}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
