$schema: https://json-schema.org/draft/2020-12/schema
$id: agentic-finding.schema.yaml
title: Agentic finding
type: object
additionalProperties: false
required: [agentic_finding_id, agentic_assessment_id, finding_type, status, title, statement, dimension, argument, affected_record_ids, impact, recommendation, action_ids, metric_ids, risk_ids, control_ids, source_ids, evidence_refs, confidence, classification, reviewed_by, reviewed_at]
properties:
  agentic_finding_id: {type: string, pattern: "^AFND-[0-9]{6}$"}
  agentic_assessment_id: {type: string, pattern: "^AAS-[0-9]{6}$"}
  finding_type: {type: string, enum: [strength, gap, risk, constraint, opportunity, progress, regression]}
  status: {type: string, enum: [proposed, in_review, approved, rejected, superseded, resolved]}
  title: {type: string}
  statement: {type: string}
  dimension: {type: string}
  argument: {type: string}
  affected_record_ids: {$ref: "#/$defs/records"}
  impact: {type: string}
  recommendation: {type: string}
  action_ids: {$ref: "#/$defs/records"}
  metric_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  confidence: {type: string, enum: [low, medium, high]}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
