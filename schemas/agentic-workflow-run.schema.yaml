$schema: https://json-schema.org/draft/2020-12/schema
$id: agentic-workflow-run.schema.yaml
title: Agentic workflow run
type: object
additionalProperties: false
required: [agentic_workflow_run_id, agentic_workflow_id, status, started_at, completed_at, initiated_by_role_ids, agent_profile_ids, input_refs, step_events, output_refs, human_approval_events, tool_and_model_versions, changes_made, validation_results, incidents_and_escalations, outcome, metric_ids, risk_ids, control_ids, classification, reviewed_by, reviewed_at]
properties:
  agentic_workflow_run_id: {type: string, pattern: "^AWRUN-[0-9]{6}$"}
  agentic_workflow_id: {type: string, pattern: "^AWF-[0-9]{6}$"}
  status: {type: string, enum: [planned, running, waiting_for_human, blocked, completed, failed, cancelled]}
  started_at: {type: string, format: date-time}
  completed_at: {type: [string, "null"], format: date-time}
  initiated_by_role_ids: {$ref: "#/$defs/records"}
  agent_profile_ids: {$ref: "#/$defs/records"}
  input_refs: {$ref: "#/$defs/text"}
  step_events: {$ref: "#/$defs/text"}
  output_refs: {$ref: "#/$defs/text"}
  human_approval_events: {$ref: "#/$defs/text"}
  tool_and_model_versions: {$ref: "#/$defs/text"}
  changes_made: {$ref: "#/$defs/text"}
  validation_results: {$ref: "#/$defs/text"}
  incidents_and_escalations: {$ref: "#/$defs/text"}
  outcome: {type: string}
  metric_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
