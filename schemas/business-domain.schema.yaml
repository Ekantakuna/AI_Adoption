$schema: https://json-schema.org/draft/2020-12/schema
$id: business-domain.schema.yaml
title: Business domain
description: Controlled business-domain or subdomain definition.
$ref: "#/$defs/domain"
$defs:
  domain:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - status
    properties:
      id:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      name:
        type: string
        minLength: 1
      description:
        type: string
      status:
        type: string
        enum:
          - proposed
          - approved
          - deprecated
      category_type:
        type: string
      security_review_required:
        type: boolean
      children:
        type: array
        items:
          $ref: "#/$defs/domain"
