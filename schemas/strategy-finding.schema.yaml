$schema: https://json-schema.org/draft/2020-12/schema
$id: strategy-finding.schema.yaml
title: Strategy finding
description: Evidence-backed finding about progress, assumptions, choices, risks or adaptation needs.
type: object
additionalProperties: false
required: [strategy_finding_id, strategy_assessment_id, finding_type, status, title, statement, affected_objective_ids, affected_choice_ids, affected_hypothesis_ids, affected_execution_record_ids, signal, qualitative_arguments, quantitative_arguments, implications, recommended_response, review_trigger_id, confidence, source_ids, evidence_refs, field_evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  strategy_finding_id: {type: string, pattern: "^SFND-[0-9]{6}$"}
  strategy_assessment_id: {type: string, pattern: "^SASMT-[0-9]{6}$"}
  finding_type: {$ref: "#/$defs/id"}
  status: {type: string, enum: [proposed, draft, in_review, approved, superseded]}
  title: {type: string, minLength: 1}
  statement: {type: string}
  affected_objective_ids: {$ref: "#/$defs/records"}
  affected_choice_ids: {$ref: "#/$defs/records"}
  affected_hypothesis_ids: {$ref: "#/$defs/records"}
  affected_execution_record_ids: {$ref: "#/$defs/records"}
  signal: {type: string, enum: [on_track, watch, intervene, stop_or_rethink, not_assessed]}
  qualitative_arguments: {$ref: "#/$defs/text"}
  quantitative_arguments: {$ref: "#/$defs/text"}
  implications: {$ref: "#/$defs/text"}
  recommended_response: {type: string}
  review_trigger_id: {$ref: "#/$defs/id"}
  confidence: {type: string, enum: [low, medium, high]}
  source_ids: {$ref: "#/$defs/sources_required"}
  evidence_refs: {$ref: "#/$defs/text_required"}
  field_evidence_refs: {$ref: "#/$defs/text_required"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  text: {type: array, uniqueItems: true, items: {type: string}}
  text_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
