$schema: https://json-schema.org/draft/2020-12/schema
$id: security-test.schema.yaml
title: Security and trust test
type: object
additionalProperties: false
required: [security_test_id, name, test_type, status, scope, method, performed_at, asset_ids, threat_model_ids, requirement_ids, risk_ids, control_ids, test_cases, results, finding_ids, limitations, remediation_action_ids, assurance_case_ids, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  security_test_id: {type: string, pattern: "^STEST-[0-9]{6}$"}
  name: {type: string}
  test_type: {$ref: "#/$defs/id"}
  status: {type: string, enum: [planned, in_progress, evidence_pending, passed, passed_with_findings, failed, inconclusive, superseded]}
  scope: {type: string}
  method: {type: string}
  performed_at: {type: [string, "null"], format: date-time}
  asset_ids: {$ref: "#/$defs/records"}
  threat_model_ids: {$ref: "#/$defs/records"}
  requirement_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  test_cases: {$ref: "#/$defs/text"}
  results: {$ref: "#/$defs/text"}
  finding_ids: {$ref: "#/$defs/records"}
  limitations: {$ref: "#/$defs/text"}
  remediation_action_ids: {$ref: "#/$defs/records"}
  assurance_case_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
