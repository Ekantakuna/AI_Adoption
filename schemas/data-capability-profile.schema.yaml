$schema: https://json-schema.org/draft/2020-12/schema
$id: data-capability-profile.schema.yaml
title: Data capability profile
description: Data capability connecting people, process, information, technology, governance and measures.
type: object
additionalProperties: false
required: [data_capability_profile_id, name, capability_area, status, description, target_outcomes, shared_capability_ids, role_ids, practice_ids, data_product_ids, solution_ids, governance_artifact_ids, risk_ids, control_ids, metric_ids, dependency_ids, source_ids, evidence_refs, assumptions, classification, reviewed_by, reviewed_at]
properties:
  data_capability_profile_id: {type: string, pattern: "^DCAP-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  capability_area: {$ref: "#/$defs/id"}
  status: {$ref: "#/$defs/status"}
  description: {type: string}
  target_outcomes: {$ref: "#/$defs/text"}
  shared_capability_ids: {$ref: "#/$defs/records"}
  role_ids: {$ref: "#/$defs/records"}
  practice_ids: {$ref: "#/$defs/records"}
  data_product_ids: {$ref: "#/$defs/records"}
  solution_ids: {$ref: "#/$defs/records"}
  governance_artifact_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  metric_ids: {$ref: "#/$defs/records"}
  dependency_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  assumptions: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, superseded, retired]}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
