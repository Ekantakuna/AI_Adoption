$schema: https://json-schema.org/draft/2020-12/schema
$id: strategy-execution-plan.schema.yaml
title: Strategy execution plan
description: Versioned execution logic linking strategy to initiatives, milestones, dependencies and adaptation triggers.
type: object
additionalProperties: false
required: [strategy_execution_plan_id, ai_strategy_id, name, version, previous_plan_id, status, start_date, target_end_date, horizon_ids, strategic_objective_ids, workstream_definitions, initiative_ids, action_ids, capability_ids, milestone_ids, dependency_ids, risk_ids, owner_stakeholder_ids, responsibility_assignments, metric_ids, review_trigger_ids, review_cadence, intervention_rules, assumptions, constraints, source_ids, evidence_refs, classification, approved_by, approved_at]
properties:
  strategy_execution_plan_id: {type: string, pattern: "^SEXEC-[0-9]{6}$"}
  ai_strategy_id: {type: string, pattern: "^AISTRAT-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  version: {type: string}
  previous_plan_id: {type: [string, "null"], pattern: "^SEXEC-[0-9]{6}$"}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, paused, completed, superseded, retired]}
  start_date: {type: [string, "null"], format: date}
  target_end_date: {type: [string, "null"], format: date}
  horizon_ids: {$ref: "#/$defs/ids"}
  strategic_objective_ids: {$ref: "#/$defs/records_required"}
  workstream_definitions: {$ref: "#/$defs/text"}
  initiative_ids: {$ref: "#/$defs/records"}
  action_ids: {$ref: "#/$defs/records"}
  capability_ids: {$ref: "#/$defs/records"}
  milestone_ids: {$ref: "#/$defs/records"}
  dependency_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  owner_stakeholder_ids: {$ref: "#/$defs/records"}
  responsibility_assignments: {$ref: "#/$defs/text"}
  metric_ids: {$ref: "#/$defs/records"}
  review_trigger_ids: {$ref: "#/$defs/ids"}
  review_cadence: {type: string}
  intervention_rules: {$ref: "#/$defs/text"}
  assumptions: {$ref: "#/$defs/text"}
  constraints: {$ref: "#/$defs/text"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  approved_by: {type: [string, "null"]}
  approved_at: {type: [string, "null"], format: date-time}
$defs:
  ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[a-z][a-z0-9_]*$"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  records_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^SOBJ-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
