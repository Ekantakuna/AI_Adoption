$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:ai-adoption:schema:relationship:1"
title: Knowledge relationship
type: object
additionalProperties: false
required: [id, type, relationship_type, from_id, to_id, evidence_ids, classification, review_status, origin, created_at, created_by]
properties:
  id: {type: string, pattern: "^REL-[0-9]{6}$"}
  type: {const: relationship}
  relationship_type: {enum: [supports, contradicts, refines, depends_on, influences, measures, mitigates, relates_to, supersedes]}
  from_id: {type: string, pattern: "^[A-Z]+-[0-9]{6}$"}
  to_id: {type: string, pattern: "^[A-Z]+-[0-9]{6}$"}
  evidence_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^EVID-[0-9]{6}$"}}
  classification: {enum: [public, internal, restricted]}
  review_status: {enum: [draft, needs_review, under_review, verified, approved, rejected, deprecated]}
  origin: {enum: [human, ai]}
  created_at: {type: string, format: date}
  created_by: {type: string, minLength: 1}
  reviewer: {$ref: "#/$defs/reviewer"}
allOf:
  - if: {properties: {review_status: {enum: [verified, approved]}}, required: [review_status]}
    then: {required: [reviewer]}
$defs:
  reviewer: {type: object, additionalProperties: false, required: [name, reviewed_at], properties: {name: {type: string, minLength: 1}, reviewed_at: {type: string, format: date}}}
