$schema: https://json-schema.org/draft/2020-12/schema
$id: provider-evaluation.schema.yaml
title: Provider evaluation
description: Evidence-backed comparison of candidate providers and offerings against approved criteria.
type: object
additionalProperties: false
required: [provider_evaluation_id, sourcing_case_id, name, status, criteria_version, evaluation_dimension_ids, weighting_method, candidate_scorecards, evaluation_panel_stakeholder_ids, evaluation_start_date, evaluation_end_date, recommendation, recommended_provider_id, recommended_offering_ids, limitations, conflict_of_interest_declarations, risk_ids, source_ids, evidence_refs, field_evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  provider_evaluation_id: {type: string, pattern: "^PEVAL-[0-9]{6}$"}
  sourcing_case_id: {type: string, pattern: "^SCASE-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  status: {type: string, enum: [proposed, criteria_approved, scoring, in_review, approved, superseded, cancelled]}
  criteria_version: {type: string}
  evaluation_dimension_ids: {$ref: "#/$defs/ids"}
  weighting_method: {type: string}
  candidate_scorecards: {type: array, items: {$ref: "#/$defs/scorecard"}}
  evaluation_panel_stakeholder_ids: {$ref: "#/$defs/records"}
  evaluation_start_date: {type: [string, "null"], format: date}
  evaluation_end_date: {type: [string, "null"], format: date}
  recommendation: {type: string}
  recommended_provider_id: {type: [string, "null"], pattern: "^EPROV-[0-9]{6}$"}
  recommended_offering_ids: {$ref: "#/$defs/records"}
  limitations: {$ref: "#/$defs/text"}
  conflict_of_interest_declarations: {$ref: "#/$defs/text"}
  risk_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources_required"}
  evidence_refs: {$ref: "#/$defs/text_required"}
  field_evidence_refs: {$ref: "#/$defs/text_required"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[a-z][a-z0-9_]*$"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  text_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
  scorecard:
    type: object
    additionalProperties: false
    required: [provider_id, offering_ids, dimension_scores, total_score, evidence_refs, assumptions, reviewer_notes]
    properties:
      provider_id: {type: string, pattern: "^EPROV-[0-9]{6}$"}
      offering_ids: {$ref: "#/$defs/records"}
      dimension_scores:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [dimension_id, score, weight, rationale, evidence_refs]
          properties:
            dimension_id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
            score: {type: number}
            weight: {type: number, minimum: 0}
            rationale: {type: string}
            evidence_refs: {$ref: "#/$defs/text_required"}
      total_score: {type: number}
      evidence_refs: {$ref: "#/$defs/text_required"}
      assumptions: {$ref: "#/$defs/text"}
      reviewer_notes: {type: string}
