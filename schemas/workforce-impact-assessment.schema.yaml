$schema: https://json-schema.org/draft/2020-12/schema
$id: workforce-impact-assessment.schema.yaml
title: Workforce impact assessment
description: Evidence-backed assessment of AI effects on roles, tasks, competencies, capacity and processes.
type: object
additionalProperties: false
required: [workforce_impact_assessment_id, name, version, status, assessment_date, scope, audience_ids, organization_unit_ids, role_ids, use_case_ids, implementation_ids, ai_technique_ids, method, data_period_start, data_period_end, impact_ids, qualitative_summary, quantitative_summary, limitations, assumptions, source_ids, evidence_refs, classification, privacy_review_status, reviewed_by, reviewed_at]
properties:
  workforce_impact_assessment_id: {type: string, pattern: "^WIA-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  version: {type: string}
  status: {type: string, enum: [proposed, draft, in_review, approved, superseded]}
  assessment_date: {type: [string, "null"], format: date}
  scope: {type: string}
  audience_ids: {$ref: "#/$defs/ids"}
  organization_unit_ids: {$ref: "#/$defs/records"}
  role_ids: {$ref: "#/$defs/records"}
  use_case_ids: {$ref: "#/$defs/records"}
  implementation_ids: {$ref: "#/$defs/records"}
  ai_technique_ids: {$ref: "#/$defs/ids"}
  method: {type: string}
  data_period_start: {type: [string, "null"], format: date}
  data_period_end: {type: [string, "null"], format: date}
  impact_ids: {$ref: "#/$defs/records"}
  qualitative_summary: {type: string}
  quantitative_summary: {type: string}
  limitations: {$ref: "#/$defs/text"}
  assumptions: {$ref: "#/$defs/text"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  privacy_review_status: {type: string, enum: [not_required, pending, approved, rejected]}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[a-z][a-z0-9_]*$"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
