$schema: https://json-schema.org/draft/2020-12/schema
$id: ai-technique.schema.yaml
title: AI technique
description: Controlled AI technique used by use-case and implementation records.
type: object
additionalProperties: false
required:
  - id
  - name
  - definition_status
properties:
  id:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
  name:
    type: string
    minLength: 1
  description:
    type: string
  definition_status:
    type: string
    enum:
      - proposed
      - approved
      - deprecated
  glossary_definition_required:
    type: boolean
