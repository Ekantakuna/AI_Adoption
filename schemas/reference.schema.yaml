$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:ai-adoption:schema:reference:1"
title: Knowledge reference metadata
description: >-
  Contextual knowledge-layer pointer that does not replace source catalogue
  metadata or atomic evidence.
type: object
additionalProperties: false
required: [id, type, title, locator, evidence_ids, classification, review_status, origin, created_at, created_by]
properties:
  id: {type: string, pattern: "^REF-[0-9]{6}$"}
  type: {const: reference}
  title: {type: string, minLength: 1}
  locator: {type: string, minLength: 1}
  evidence_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: "^EVID-[0-9]{6}$"}
  classification: {enum: [public, internal, restricted]}
  review_status: {enum: [draft, needs_review, under_review, verified, approved, rejected, deprecated]}
  origin: {enum: [human, ai]}
  created_at: {type: string, format: date}
  created_by: {type: string, minLength: 1}
  reviewer: {$ref: "#/$defs/reviewer"}
allOf:
  - if:
      properties:
        review_status: {enum: [verified, approved]}
      required: [review_status]
    then: {required: [reviewer]}
$defs:
  reviewer:
    type: object
    additionalProperties: false
    required: [name, reviewed_at]
    properties:
      name: {type: string, minLength: 1}
      reviewed_at: {type: string, format: date}
