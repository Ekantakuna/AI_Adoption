$schema: https://json-schema.org/draft/2020-12/schema
$id: organization-finding.schema.yaml
title: Organization finding
description: Evidence-backed strength, drawback, gap, dependency, constraint, risk or opportunity.
type: object
additionalProperties: false
required: [organization_finding_id, organization_assessment_id, finding_type, status, title, statement, constituency_ids, organization_dimension_ids, related_domain_ids, current_state, target_state, gap_statement, qualitative_arguments, quantitative_arguments, severity, confidence, affected_unit_ids, affected_role_ids, affected_practice_ids, source_ids, evidence_refs, field_evidence_refs, recommendation, classification, reviewed_by, reviewed_at]
properties:
  organization_finding_id: {type: string, pattern: "^OFND-[0-9]{6}$"}
  organization_assessment_id: {type: string, pattern: "^OAS-[0-9]{6}$"}
  finding_type: {$ref: "#/$defs/id"}
  status: {$ref: "#/$defs/status"}
  title: {type: string, minLength: 1}
  statement: {type: string}
  constituency_ids: {$ref: "#/$defs/ids"}
  organization_dimension_ids: {$ref: "#/$defs/ids"}
  related_domain_ids: {$ref: "#/$defs/ids"}
  current_state: {type: string}
  target_state: {type: string}
  gap_statement: {type: string}
  qualitative_arguments: {$ref: "#/$defs/text"}
  quantitative_arguments: {$ref: "#/$defs/text"}
  severity: {type: string, enum: [low, medium, high, critical, not_assessed]}
  confidence: {type: string, enum: [low, medium, high]}
  affected_unit_ids: {$ref: "#/$defs/records"}
  affected_role_ids: {$ref: "#/$defs/records"}
  affected_practice_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources_required"}
  evidence_refs: {$ref: "#/$defs/text_required"}
  field_evidence_refs: {$ref: "#/$defs/text_required"}
  recommendation: {type: string}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  status: {type: string, enum: [proposed, draft, in_review, approved, superseded, retired]}
  ids: {type: array, uniqueItems: true, items: {$ref: "#/$defs/id"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  text_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
