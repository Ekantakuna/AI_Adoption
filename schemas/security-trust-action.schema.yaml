$schema: https://json-schema.org/draft/2020-12/schema
$id: security-trust-action.schema.yaml
title: Security and trust action
type: object
additionalProperties: false
required: [security_trust_action_id, name, action_type, status, description, intended_outcome, finding_ids, assessment_ids, initiative_ids, owner_role_ids, milestone_ids, dependency_ids, affected_record_ids, target_date, completion_date, metric_ids, risk_ids, control_ids, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  security_trust_action_id: {type: string, pattern: "^STACT-[0-9]{6}$"}
  name: {type: string}
  action_type: {type: string, enum: [requirement, architecture, threat_treatment, control, testing, monitoring, incident_response, resilience, assurance, training, retirement]}
  status: {type: string, enum: [proposed, approved, planned, in_progress, blocked, completed, cancelled, superseded]}
  description: {type: string}
  intended_outcome: {type: string}
  finding_ids: {$ref: "#/$defs/records"}
  assessment_ids: {$ref: "#/$defs/records"}
  initiative_ids: {$ref: "#/$defs/records"}
  owner_role_ids: {$ref: "#/$defs/records"}
  milestone_ids: {$ref: "#/$defs/records"}
  dependency_ids: {$ref: "#/$defs/records"}
  affected_record_ids: {$ref: "#/$defs/records"}
  target_date: {type: [string, "null"], format: date}
  completion_date: {type: [string, "null"], format: date}
  metric_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
