$schema: https://json-schema.org/draft/2020-12/schema
$id: data-readiness-target.schema.yaml
title: Data readiness target
description: Versioned TO-BE data-readiness profile for AI.
type: object
additionalProperties: false
required: [data_readiness_target_id, name, version, status, purpose, scope, target_dimension_ids, target_capability_ids, target_data_product_ids, quality_framework_ids, governance_requirement_ids, metadata_requirements, observability_requirements, intended_outcomes, metric_ids, risk_ids, control_ids, assumptions, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  data_readiness_target_id: {type: string, pattern: "^DRTGT-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  version: {type: string}
  status: {$ref: "#/$defs/status"}
  purpose: {type: string}
  scope: {type: string}
  target_dimension_ids: {$ref: "#/$defs/ids"}
  target_capability_ids: {$ref: "#/$defs/records"}
  target_data_product_ids: {$ref: "#/$defs/records"}
  quality_framework_ids: {$ref: "#/$defs/records"}
  governance_requirement_ids: {$ref: "#/$defs/records"}
  metadata_requirements: {$ref: "#/$defs/text"}
  observability_requirements: {$ref: "#/$defs/text"}
  intended_outcomes: {$ref: "#/$defs/text"}
  metric_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  assumptions: {$ref: "#/$defs/text"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"}}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, superseded, retired]}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
