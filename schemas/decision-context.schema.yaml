$schema: https://json-schema.org/draft/2020-12/schema
$id: decision-context.schema.yaml
title: Decision context
description: Versioned business context and semantic boundary for a decision.
type: object
additionalProperties: false
required: [decision_context_id, decision_type_id, decision_id, name, version, status, effective_from, effective_to, scope, business_problem, business_domain_ids, glossary_term_ids, assumptions, constraints, applicable_policy_ids, data_and_solution_ids, stakeholder_ids, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  decision_context_id: {type: string, pattern: "^DCTX-[0-9]{6}$"}
  decision_type_id: {type: string, pattern: "^DTYPE-[0-9]{6}$"}
  decision_id: {type: [string, "null"], pattern: "^DEC-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  version: {type: string}
  status: {$ref: "#/$defs/status"}
  effective_from: {type: [string, "null"], format: date-time}
  effective_to: {type: [string, "null"], format: date-time}
  scope: {type: string}
  business_problem: {type: string}
  business_domain_ids: {$ref: "#/$defs/ids"}
  glossary_term_ids: {$ref: "#/$defs/records"}
  assumptions: {$ref: "#/$defs/text"}
  constraints: {$ref: "#/$defs/text"}
  applicable_policy_ids: {$ref: "#/$defs/records"}
  data_and_solution_ids: {$ref: "#/$defs/records"}
  stakeholder_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[a-z][a-z0-9_]*$"}}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, superseded, retired]}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
