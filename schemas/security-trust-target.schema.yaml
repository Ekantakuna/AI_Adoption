$schema: https://json-schema.org/draft/2020-12/schema
$id: security-trust-target.schema.yaml
title: Security and trust target
type: object
additionalProperties: false
required: [security_trust_target_id, name, version, status, purpose, scope, trust_dimension_ids, target_outcomes, requirement_ids, architecture_ids, capability_ids, risk_ids, control_ids, metric_ids, assumptions, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  security_trust_target_id: {type: string, pattern: "^STTGT-[0-9]{6}$"}
  name: {type: string}
  version: {type: string}
  status: {$ref: "#/$defs/status"}
  purpose: {type: string}
  scope: {type: string}
  trust_dimension_ids: {$ref: "#/$defs/ids"}
  target_outcomes: {$ref: "#/$defs/text"}
  requirement_ids: {$ref: "#/$defs/records"}
  architecture_ids: {$ref: "#/$defs/records"}
  capability_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  metric_ids: {$ref: "#/$defs/records"}
  assumptions: {$ref: "#/$defs/text"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs: &stdefs
  ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"}}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, superseded, retired]}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
