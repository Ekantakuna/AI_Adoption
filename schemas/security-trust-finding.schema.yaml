$schema: https://json-schema.org/draft/2020-12/schema
$id: security-trust-finding.schema.yaml
title: Security and trust finding
type: object
additionalProperties: false
required: [security_trust_finding_id, assessment_id, finding_type, status, title, statement, trust_dimension_id, argument, affected_record_ids, impact, recommendation, action_ids, risk_ids, control_ids, source_ids, evidence_refs, confidence, classification, reviewed_by, reviewed_at]
properties:
  security_trust_finding_id: {type: string, pattern: "^STFND-[0-9]{6}$"}
  assessment_id: {type: string, pattern: "^STAS-[0-9]{6}$"}
  finding_type: {type: string, enum: [strength, gap, threat_exposure, control_weakness, test_failure, assurance_gap, resilience_gap, opportunity, progress]}
  status: {type: string, enum: [proposed, evidence_pending, substantiated, disputed, accepted, resolved, superseded]}
  title: {type: string}
  statement: {type: string}
  trust_dimension_id: {type: [string, "null"], pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"}
  argument: {type: string}
  affected_record_ids: {$ref: "#/$defs/records"}
  impact: {type: string}
  recommendation: {type: string}
  action_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  confidence: {type: string, enum: [unknown, low, medium, high]}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
