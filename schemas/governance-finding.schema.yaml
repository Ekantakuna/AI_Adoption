$schema: https://json-schema.org/draft/2020-12/schema
$id: governance-finding.schema.yaml
title: Governance finding
description: Evidence-backed strength, gap, risk exposure, weakness, dependency, constraint or opportunity.
type: object
additionalProperties: false
required: [governance_finding_id, governance_assessment_id, finding_type, status, title, statement, governance_domain_ids, lifecycle_stage_ids, capability_ids, risk_ids, control_ids, current_state, target_state, gap_statement, qualitative_arguments, quantitative_arguments, severity, confidence, source_ids, evidence_refs, field_evidence_refs, recommendation, classification, reviewed_by, reviewed_at]
properties:
  governance_finding_id: {type: string, pattern: "^GFND-[0-9]{6}$"}
  governance_assessment_id: {type: string, pattern: "^GAS-[0-9]{6}$"}
  finding_type: {$ref: "#/$defs/id"}
  status: {$ref: "#/$defs/status"}
  title: {type: string, minLength: 1}
  statement: {type: string}
  governance_domain_ids: {$ref: "#/$defs/ids"}
  lifecycle_stage_ids: {$ref: "#/$defs/ids"}
  capability_ids: {$ref: "#/$defs/record_ids"}
  risk_ids: {$ref: "#/$defs/record_ids"}
  control_ids: {$ref: "#/$defs/record_ids"}
  current_state: {type: string}
  target_state: {type: string}
  gap_statement: {type: string}
  qualitative_arguments: {$ref: "#/$defs/text"}
  quantitative_arguments: {$ref: "#/$defs/text"}
  severity: {type: string, enum: [low, medium, high, critical, not_assessed]}
  confidence: {type: string, enum: [low, medium, high]}
  source_ids: {$ref: "#/$defs/source_ids_required"}
  evidence_refs: {$ref: "#/$defs/text_required"}
  field_evidence_refs: {$ref: "#/$defs/text_required"}
  recommendation: {type: string}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  status: {type: string, enum: [proposed, draft, in_review, approved, superseded, retired]}
  ids: {type: array, uniqueItems: true, items: {$ref: "#/$defs/id"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  text_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  record_ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  source_ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  source_ids_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
