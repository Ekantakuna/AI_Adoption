$schema: https://json-schema.org/draft/2020-12/schema
$id: workforce-impact.schema.yaml
title: Workforce impact
description: Granular privacy-safe workforce impact linked to an assessed segment, role, task or competency.
type: object
additionalProperties: false
required: [workforce_impact_id, workforce_impact_assessment_id, status, impact_type, impact_direction, title, statement, audience_ids, organization_unit_ids, role_ids, affected_task_refs, competency_ids, current_state, anticipated_change, timeframe, magnitude, confidence, people_count, personal_data_included, change_action_ids, literacy_program_ids, source_ids, evidence_refs, field_evidence_refs, assumptions, classification, reviewed_by, reviewed_at]
properties:
  workforce_impact_id: {type: string, pattern: "^WIMP-[0-9]{6}$"}
  workforce_impact_assessment_id: {type: string, pattern: "^WIA-[0-9]{6}$"}
  status: {type: string, enum: [proposed, draft, in_review, approved, superseded]}
  impact_type: {$ref: "#/$defs/id"}
  impact_direction: {$ref: "#/$defs/id"}
  title: {type: string, minLength: 1}
  statement: {type: string}
  audience_ids: {$ref: "#/$defs/ids"}
  organization_unit_ids: {$ref: "#/$defs/records"}
  role_ids: {$ref: "#/$defs/records"}
  affected_task_refs: {$ref: "#/$defs/text"}
  competency_ids: {$ref: "#/$defs/records"}
  current_state: {type: string}
  anticipated_change: {type: string}
  timeframe: {type: [string, "null"]}
  magnitude: {type: string, enum: [low, medium, high, not_assessed]}
  confidence: {type: string, enum: [low, medium, high]}
  people_count: {type: [integer, "null"], minimum: 0}
  personal_data_included: {const: false}
  change_action_ids: {$ref: "#/$defs/records"}
  literacy_program_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources_required"}
  evidence_refs: {$ref: "#/$defs/text_required"}
  field_evidence_refs: {$ref: "#/$defs/text_required"}
  assumptions: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  ids: {type: array, uniqueItems: true, items: {$ref: "#/$defs/id"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  text_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
