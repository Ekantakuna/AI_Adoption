$schema: https://json-schema.org/draft/2020-12/schema
$id: threat-model.schema.yaml
title: AI threat model
type: object
additionalProperties: false
required: [threat_model_id, name, version, status, scope, asset_ids, trust_boundaries, data_and_action_flows, threat_actor_ids, threat_scenarios, assumptions, risk_ids, control_ids, test_ids, architecture_ids, review_triggers, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  threat_model_id: {type: string, pattern: "^THMOD-[0-9]{6}$"}
  name: {type: string}
  version: {type: string}
  status: {type: string, enum: [proposed, draft, in_review, approved, active, superseded, retired]}
  scope: {type: string}
  asset_ids: {$ref: "#/$defs/records"}
  trust_boundaries: {$ref: "#/$defs/text"}
  data_and_action_flows: {$ref: "#/$defs/text"}
  threat_actor_ids: {$ref: "#/$defs/ids"}
  threat_scenarios: {$ref: "#/$defs/text"}
  assumptions: {$ref: "#/$defs/text"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  test_ids: {$ref: "#/$defs/records"}
  architecture_ids: {$ref: "#/$defs/records"}
  review_triggers: {$ref: "#/$defs/text"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
