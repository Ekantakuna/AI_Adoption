$schema: https://json-schema.org/draft/2020-12/schema
$id: strategy-simulation.schema.yaml
title: Strategy simulation
description: Reproducible simulation or structured challenge run; results are not facts.
type: object
additionalProperties: false
required: [strategy_simulation_id, name, simulation_type, status, run_at, purpose, scenario_ids, strategic_choice_ids, hypothesis_ids, model_or_method, model_version, input_assumptions, input_data_refs, parameter_values, run_configuration, output_summary, sensitivity_findings, limitations, confidence, decision_implications, result_status, source_ids, evidence_refs, classification, prepared_by, reviewed_by, reviewed_at]
properties:
  strategy_simulation_id: {type: string, pattern: "^SIM-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  simulation_type: {$ref: "#/$defs/id"}
  status: {type: string, enum: [planned, configured, run, reviewed, superseded, invalidated]}
  run_at: {type: [string, "null"], format: date-time}
  purpose: {type: string}
  scenario_ids: {$ref: "#/$defs/records_required"}
  strategic_choice_ids: {$ref: "#/$defs/records"}
  hypothesis_ids: {$ref: "#/$defs/records"}
  model_or_method: {type: string}
  model_version: {type: string}
  input_assumptions: {$ref: "#/$defs/text"}
  input_data_refs: {$ref: "#/$defs/text"}
  parameter_values: {type: object, additionalProperties: true}
  run_configuration: {type: object, additionalProperties: true}
  output_summary: {type: string}
  sensitivity_findings: {$ref: "#/$defs/text"}
  limitations: {$ref: "#/$defs/text"}
  confidence: {type: string, enum: [low, medium, high]}
  decision_implications: {$ref: "#/$defs/text"}
  result_status: {const: simulated_not_factual}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  prepared_by: {type: string}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  records_required: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^SCEN-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
