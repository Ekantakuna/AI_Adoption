$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:ai-adoption:schema:source-processing-authorizations:1"
title: Source processing authorization register
type: object
additionalProperties: false
required: [schema_version, register, records]
properties:
  schema_version: {const: 1}
  register: {const: source_processing_authorizations}
  records:
    type: array
    items: {$ref: "#/$defs/authorization"}
$defs:
  authorization:
    type: object
    additionalProperties: false
    required: [id, source_id, classification, route_id, tool_id, environment, status, approved_by, approved_at, basis_refs]
    properties:
      id: {type: string, pattern: "^AUTH-[0-9]{6}$"}
      source_id: {type: string, pattern: "^SRC-[A-Z0-9]+-[0-9]{6}$"}
      classification: {enum: [public, internal, restricted]}
      route_id: {enum: [local_only, external_processing_approved]}
      tool_id: {enum: [pdftotext_local, textutil_local, repository_text_reader, human_visual_review, pptx_xml_reader]}
      environment: {enum: [approved_local, approved_on_prem, approved_external]}
      status: {enum: [proposed, approved, revoked]}
      approved_by: {type: string, minLength: 1}
      approved_at: {type: string, format: date}
      basis_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      notes: {type: string}
    allOf:
      - if:
          properties: {classification: {const: restricted}}
          required: [classification]
        then:
          properties:
            route_id: {const: local_only}
            environment: {const: approved_on_prem}
      - if:
          properties: {route_id: {const: external_processing_approved}}
          required: [route_id]
        then:
          properties:
            classification: {const: public}
