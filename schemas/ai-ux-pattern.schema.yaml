$schema: https://json-schema.org/draft/2020-12/schema
$id: ai-ux-pattern.schema.yaml
title: AI UX pattern
description: Reusable human-AI interaction pattern with transparency, control, accessibility and recovery requirements.
type: object
additionalProperties: false
required: [ai_ux_pattern_id, name, pattern_type, version, status, user_need, context, interaction_flow, AI_disclosure, human_control, uncertainty_and_evidence_presentation, feedback_and_correction, error_recovery, accessibility_requirements, applicable_use_case_ids, design_pattern_ids, metric_ids, risk_ids, control_ids, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  ai_ux_pattern_id: {type: string, pattern: "^AIUX-[0-9]{6}$"}
  name: {type: string, minLength: 1}
  pattern_type: {$ref: "#/$defs/id"}
  version: {type: string}
  status: {type: string, enum: [candidate, proposed, in_review, approved, deprecated, superseded, retired]}
  user_need: {type: string}
  context: {type: string}
  interaction_flow: {$ref: "#/$defs/text"}
  AI_disclosure: {type: string}
  human_control: {type: string}
  uncertainty_and_evidence_presentation: {type: string}
  feedback_and_correction: {type: string}
  error_recovery: {type: string}
  accessibility_requirements: {$ref: "#/$defs/text"}
  applicable_use_case_ids: {$ref: "#/$defs/records"}
  design_pattern_ids: {$ref: "#/$defs/records"}
  metric_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  id: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
