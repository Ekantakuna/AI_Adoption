$schema: https://json-schema.org/draft/2020-12/schema
$id: sourcing-agreement.schema.yaml
title: Sourcing agreement metadata
description: Repository-safe agreement metadata; restricted contract text remains outside the repository.
type: object
additionalProperties: false
required: [sourcing_agreement_id, sourcing_case_id, provider_id, offering_ids, agreement_type_ids, title, status, repository_safe_reference, signed_date, effective_date, expiry_date, renewal_notice_date, termination_notice_period, owner_stakeholder_ids, commercial_model_summary, currency, committed_value, restricted_terms_location_ref, obligation_summaries, service_level_metric_ids, solution_ids, dependency_ids, risk_ids, control_ids, due_diligence_ids, performance_review_ids, exit_plan_id, source_ids, evidence_refs, classification, reviewed_by, reviewed_at]
properties:
  sourcing_agreement_id: {type: string, pattern: "^AGR-[0-9]{6}$"}
  sourcing_case_id: {type: string, pattern: "^SCASE-[0-9]{6}$"}
  provider_id: {type: string, pattern: "^EPROV-[0-9]{6}$"}
  offering_ids: {$ref: "#/$defs/records"}
  agreement_type_ids: {$ref: "#/$defs/ids"}
  title: {type: string, minLength: 1}
  status: {type: string, enum: [draft, negotiation, pending_approval, active, suspended, expired, terminated, superseded]}
  repository_safe_reference: {type: string}
  signed_date: {type: [string, "null"], format: date}
  effective_date: {type: [string, "null"], format: date}
  expiry_date: {type: [string, "null"], format: date}
  renewal_notice_date: {type: [string, "null"], format: date}
  termination_notice_period: {type: [string, "null"]}
  owner_stakeholder_ids: {$ref: "#/$defs/records"}
  commercial_model_summary: {type: string}
  currency: {type: [string, "null"]}
  committed_value: {type: [number, "null"], minimum: 0}
  restricted_terms_location_ref: {type: [string, "null"]}
  obligation_summaries: {type: array, items: {$ref: "#/$defs/obligation"}}
  service_level_metric_ids: {$ref: "#/$defs/records"}
  solution_ids: {$ref: "#/$defs/records"}
  dependency_ids: {$ref: "#/$defs/records"}
  risk_ids: {$ref: "#/$defs/records"}
  control_ids: {$ref: "#/$defs/records"}
  due_diligence_ids: {$ref: "#/$defs/records"}
  performance_review_ids: {$ref: "#/$defs/records"}
  exit_plan_id: {type: [string, "null"], pattern: "^EXIT-[0-9]{6}$"}
  source_ids: {$ref: "#/$defs/sources"}
  evidence_refs: {$ref: "#/$defs/text"}
  classification: {$ref: "#/$defs/classification"}
  reviewed_by: {type: [string, "null"]}
  reviewed_at: {type: [string, "null"], format: date-time}
$defs:
  ids: {type: array, uniqueItems: true, items: {type: string, pattern: "^[a-z][a-z0-9_]*$"}}
  text: {type: array, uniqueItems: true, items: {type: string}}
  records: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]{6}$"}}
  sources: {type: array, uniqueItems: true, items: {type: string, pattern: "^SRC-[A-Z]{2,4}-[0-9]{6}$"}}
  classification: {type: string, enum: [pending, public, internal, restricted]}
  obligation:
    type: object
    additionalProperties: false
    required: [obligation_type, summary, accountable_party, metric_ids, control_ids, evidence_refs]
    properties:
      obligation_type: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
      summary: {type: string}
      accountable_party: {type: string, enum: [provider, customer, shared]}
      metric_ids: {$ref: "#/$defs/records"}
      control_ids: {$ref: "#/$defs/records"}
      evidence_refs: {$ref: "#/$defs/text"}
