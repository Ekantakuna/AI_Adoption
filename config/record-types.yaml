    - strategic_objective
    - strategic_choice
    - strategic_hypothesis
    - decision_intelligence_target
    - critical_success_factor
  strategic_intent/vision.mmd:
    - ai_strategy
    - strategic_objective
    - decision_intelligence_target
    - critical_success_factor
  strategic_intent/strategy.mmd:
    - ai_strategy
    - strategic_objective
    - strategic_choice
    - strategic_hypothesis
    - strategy_scenario
    - critical_success_factor
    - strategy_execution_plan
    - metric
  people_and_culture:
    - ai_change_plan
    - ai_change_action
    - ai_awareness_campaign
    - ai_literacy_program
    - workforce_impact_assessment
    - workforce_impact
    - employee_readiness_assessment
    - employee_readiness_finding
    - people_change_snapshot
    - capability
    - competency
  organization:
    - organization_target
    - organization_operating_model
    - organization_unit
    - organization_role
    - organization_network
    - organization_practice
    - partnership_requirement
    - organization_tool_requirement
    - organization_assessment
    - organization_finding
    - organization_action
    - capability
    - competency
  organization/research:
    - organization_target
    - organization_operating_model
    - organization_unit
