    - governance_role
  governance/research/governance_policies_and_how_to:
    - governance_artifact
    - governance_capability
    - control
  current_state/implemented_use_cases:
    - implementation
    - implementation_snapshot
    - use_case_pattern
  current_state/shared_platforms:
    - solution
    - implementation_snapshot
  current_state/project_summaries:
    - initiative
    - implementation
    - implementation_snapshot
  maturity_execution/framework:
    - maturity_framework
  maturity_execution/models:
    - maturity_model
  maturity_execution/assessment_inputs:
    - maturity_assessment
    - maturity_finding
  maturity_execution/assessment_reports:
    - maturity_assessment
    - maturity_finding
  maturity_execution/action_plans:
    - maturity_action
    - initiative

candidate_record_status: proposed
human_review_required: true
field_level_provenance_required: true
