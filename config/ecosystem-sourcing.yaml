  - on_track
  - watch
  - remediation_required
  - executive_intervention
  - renewal_at_risk
  - exit_or_recompetition
  - not_assessed

exit_trigger_types:
  - agreement_expiry
  - material_breach
  - performance_failure
  - security_privacy_or_compliance_event
  - unacceptable_cost_or_value
  - strategic_or_architecture_change
  - provider_viability_change
  - concentration_or_lock_in_reduction
  - regulatory_requirement
  - replacement_selected
  - internal_capability_available

