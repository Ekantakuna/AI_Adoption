  - software_or_model_license
  - data_or_content_license
  - statement_of_work
  - data_processing_agreement
  - service_level_agreement
  - partnership_or_collaboration_agreement
  - research_or_pilot_agreement
  - support_and_maintenance_agreement

agreement_obligation_types:
  - service_level
  - security_and_privacy
  - data_use_location_and_retention
  - model_training_and_content_use
  - intellectual_property_and_indemnity
  - audit_and_evidence_access
  - incident_notification
  - regulatory_cooperation
  - change_notification
  - subcontractor_management
  - business_continuity
  - portability_transition_and_exit
  - pricing_and_usage

