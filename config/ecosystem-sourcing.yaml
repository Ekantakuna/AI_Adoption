  - governance_responsible_ai_and_compliance
  - commercial_and_total_cost
  - value_and_outcome_potential
  - delivery_and_support_capability
  - scalability_and_performance
  - interoperability_portability_and_exit
  - provider_viability_and_roadmap
  - concentration_and_lock_in
  - sustainability_and_social_impact

due_diligence_domains:
  - legal_entity_and_authority
  - financial_viability
  - legal_and_regulatory
  - contracting_and_commercial
  - licensing_and_intellectual_property
  - data_protection_and_privacy
  - information_and_cyber_security
  - responsible_ai_model_and_agent_risk
  - operational_resilience_and_continuity
  - subcontractors_and_supply_chain
  - service_delivery_and_support
  - data_location_and_cross_border_transfer
  - audit_evidence_and_assurance
