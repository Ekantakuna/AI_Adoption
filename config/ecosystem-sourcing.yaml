  - service_transition
  - data_export_return_or_deletion
  - model_prompt_agent_and_configuration_portability
  - knowledge_and_documentation_transfer
  - identity_access_and_secret_revocation
  - integration_and_dependency_removal
  - continuity_and_fallback
  - legal_commercial_and_license_termination
  - evidence_and_compliance_closure
  - workforce_and_stakeholder_change

selection_statuses:
  - requirements_only
  - market_discovery
  - evaluation
  - due_diligence
  - decision_pending
  - selected
  - not_selected
  - cancelled
  - superseded

semantic_relationships:
  - subject: partnership_requirement
    predicate: initiates
    object: sourcing_case
  - subject: strategic_choice
    predicate: constrains
    object: sourcing_case
  - subject: sourcing_case
    predicate: evaluates
    object: providers_and_offerings
  - subject: provider_evaluation
    predicate: compares
    object: candidate_providers_and_offerings
  - subject: provider_due_diligence
    predicate: identifies
    object: risks_controls_conditions_and_remediation
  - subject: sourcing_agreement
    predicate: governs
    object: provider_offering_solution_and_obligations
  - subject: provider_performance
    predicate: measures
    object: agreement_service_value_risk_and_outcomes
  - subject: sourcing_exit_plan
    predicate: reduces
    object: lock_in_concentration_continuity_and_transition_risk

cross_domain_mappings:
  partnership_requirements: registers/partnership-requirements.yaml
  strategic_choices: registers/strategic-choices.yaml
  solutions: registers/solutions.yaml
  risks: registers/risks.yaml
  controls: registers/controls.yaml
  metrics: registers/metrics.yaml
  dependencies: registers/dependencies.yaml

evidence_rules:
  provider_and_offering_claims_require_source_ids: true
  evaluation_criteria_require_approval_before_scoring: true
  scores_require_evidence_and_review: true
  due_diligence_does_not_imply_legal_security_or_compliance_approval: true
  selection_requires_decision_reference: true
  agreement_records_store_metadata_not_restricted_contract_content: true
  performance_reviews_require_metric_evidence: true
  selected_or_material_providers_require_exit_plan: true
  source_derived_records_remain_proposed_until_human_review: true
