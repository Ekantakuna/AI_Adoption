schema_version: 1

model_status: proposed
human_review_required: true
source_evidence_required_for_provider_claims: true
selection_requires_approved_decision: true

sourcing_lifecycle_stages:
  - need_identification
  - make_buy_partner_review
  - sourcing_case_approval
  - market_discovery
  - request_and_response
  - evaluation
  - due_diligence
  - selection_decision
  - negotiation_and_agreement
  - onboarding_and_integration
  - active_service_management
  - performance_and_value_review
  - renewal_or_recompetition
  - transition_and_exit

