  - service_level_and_availability
  - quality_accuracy_and_reliability
  - security_privacy_and_compliance
  - delivery_and_support
  - cost_and_consumption
  - realized_value_and_outcomes
  - innovation_and_roadmap
  - relationship_and_governance
