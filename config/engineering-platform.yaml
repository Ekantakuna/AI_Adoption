  metrics: registers/metrics.yaml
  capabilities: registers/capabilities.yaml
  initiatives: registers/initiatives.yaml
  dependencies: registers/dependencies.yaml

evidence_and_decision_rules:
  current_state_claims_require_source_ids: true
  option_evaluations_require_approved_criteria_and_evidence: true
  technical_evaluation_does_not_select_a_provider_or_solution: true
  strategic_choice_or_decision_reference_required_for_selection: true
  provider_claims_require_ecosystem_evidence: true
  implemented_status_requires_current_state_evidence: true
  catalogue_registration_does_not_imply_approval: true
  security_test_does_not_imply_security_approval: true
  risk_or_control_check_does_not_replace_governance_approval: true
  compliance_evidence_does_not_imply_compliance_conclusion: true
  observability_and_AI_UX_claims_require_metrics_or_review_evidence: true
  source_derived_records_remain_proposed_until_human_review: true
