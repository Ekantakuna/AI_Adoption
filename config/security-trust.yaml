evidence_and_authority_rules:
  current_state_and_exposure_claims_require_source_ids: true
  security_safe_compliant_or_trustworthy_claims_require_assurance_case: true
  testing_does_not_by_itself_approve_deployment_or_accept_risk: true
  risk_acceptance_requires_accountable_human_decision: true
  control_effectiveness_requires_test_evidence_and_review: true
  threat_models_require_scope_assets_boundaries_and_assumptions: true
  events_preserve_timeline_response_impact_and_learning: true
  source_derived_records_remain_proposed_until_human_review: true
