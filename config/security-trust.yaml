  - {subject: threat_model, predicate: identifies, object: threat_scenarios_risks_and_control_needs}
  - {subject: security_trust_architecture, predicate: realizes, object: requirements_controls_and_trust_boundaries}
  - {subject: security_trust_practice, predicate: operates, object: secure_ai_lifecycle}
  - {subject: assurance_case, predicate: supports, object: bounded_trust_or_security_claim}
  - {subject: security_test, predicate: provides_evidence_for, object: risks_controls_and_assurance_cases}
  - {subject: security_trust_event, predicate: triggers, object: response_risk_review_and_learning}
  - {subject: security_trust_assessment, predicate: identifies, object: security_trust_findings}
  - {subject: security_trust_finding, predicate: justifies, object: security_trust_action}

