schema_version: 1

source_root:
  id: SROOT-0001
  path: /Users/maksimzakharenkau/Documents/AI/Outlook/2026/Inputs
  storage: local_only

processing_states:
  - discovered
  - metadata_catalogued
  - classification_pending
  - approved_for_processing
  - approved_local
  - approved_external
  - extraction_in_progress
  - extracted
  - reviewed
  - rejected
  - superseded
  - unreadable

processing_routes:
  - pending
  - local
  - external
  - prohibited

content_access_states:
  - approved_local
  - approved_external
  - extraction_in_progress
  - extracted
  - reviewed

state_transitions:
  discovered:
    - metadata_catalogued
    - rejected
    - unreadable
  metadata_catalogued:
    - classification_pending
    - rejected
    - superseded
    - unreadable
  classification_pending:
    - approved_for_processing
    - rejected
    - unreadable
  approved_for_processing:
    - approved_local
    - approved_external
    - rejected
    - superseded
  approved_local:
    - extraction_in_progress
    - rejected
    - superseded
  approved_external:
    - extraction_in_progress
    - rejected
    - superseded
  extraction_in_progress:
    - extracted
    - rejected
    - unreadable
  extracted:
    - reviewed
    - rejected
    - superseded
  reviewed:
    - superseded
  rejected: []
  superseded: []
  unreadable:
    - superseded

processing_approval_rules:
  approved_for_processing:
    content_access: false
    requires:
      - final_classification
      - compatible_approved_tool
  approved_local:
    content_access: true
    route: local
    requires:
      - final_classification
      - approved_processing_route
      - approved_local_tool
      - approver
      - approval_date
  approved_external:
    content_access: true
    route: external
    not_implied_by_public_classification: true
    requires:
      - final_classification
      - approved_processing_route
      - approved_external_service
      - approved_account
      - approved_purpose
      - approver
      - approval_date

classification_states:
  - pending
  - public
  - internal
  - restricted

source_types:
  pdf:
    extensions:
      - .pdf
    extraction_status: supported
    original_in_git: false

  word:
    extensions:
      - .doc
      - .docx
    extraction_status: supported
    original_in_git: false

  presentation:
    extensions:
      - .ppt
      - .pptx
      - .key
    extraction_status: review_required
    original_in_git: false

  spreadsheet:
    extensions:
      - .xls
      - .xlsx
      - .csv
    extraction_status: review_required
    original_in_git: false

  image:
    extensions:
      - .png
      - .jpg
      - .jpeg
      - .webp
      - .svg
    extraction_status: review_required
    original_in_git: false

  markdown:
    extensions:
      - .md
    extraction_status: supported
    original_in_git: conditional

  text:
    extensions:
      - .txt
      - .rtf
    extraction_status: supported
    original_in_git: conditional

  apple_document:
    extensions:
      - .pages
    extraction_status: review_required
    original_in_git: false

  web_document:
    extensions:
      - .html
      - .htm
    extraction_status: review_required
    original_in_git: false

  mind_map:
    extensions:
      - .mmd
    extraction_status: review_required
    original_in_git: false

conditional_original_in_git:
  applies_to:
    - markdown
    - text
  allowed_when:
    - repository_native_project_content
    - approved_repository_derivative
  prohibited_when:
    - original_evidence_from_source_root
    - contains_credentials
    - contains_personal_data
    - contains_restricted_operational_data
  requires:
    - approved_classification
    - approved_processing_route
    - source_provenance_when_derived

ignored_files:
  - .DS_Store
  - Thumbs.db
  - "*.tmp"
  - "~$*"
  - "*.swp"
  - "*.bak"
  - "*.part"
  - "*.crdownload"

source_id_prefixes:
  glossary: SRC-GLO
  scope: SRC-SCO
  decision_environment: SRC-DEC
  vision: SRC-VIS
  organization: SRC-ORG
  agentic_ai: SRC-AGT
  governance: SRC-GOV
  maturity: SRC-MAT
  maturity_framework: SRC-MFW
  maturity_model: SRC-MOD
  maturity_assessment: SRC-MAS
  maturity_evidence: SRC-MEV
  maturity_action_plan: SRC-MAP
  data: SRC-DATA
  engineering_platform: SRC-ENG
  ecosystem_sourcing: SRC-ECO
  security: SRC-SEC
  risk_trust: SRC-RSK
  value_management: SRC-VAL
  use_cases: SRC-UC
  telecom: SRC-TEL
  prompt_context: SRC-PRM
  implementation: SRC-IMP
  platform: SRC-PLT
  project_summary: SRC-PRJ
  miscellaneous: SRC-MIS

source_id_policy:
  format: "<source-category-prefix>-<six-digit-sequence>"
  sequence_scope: per_prefix
  sequence_start: 1
  sequence_allocation: next_unused_monotonic
  reuse: prohibited
  immutable_after_assignment: true
  primary_category_required: true
  multiple_prefixes_per_source: prohibited
  unmatched_source_action: category_review_required
  matching_rule: longest_matching_current_relative_path
  taxonomy_relationship:
    source_category_is_taxonomy_domain: false
    additional_domains_field: domain_ids
    prefix_changes_when_domains_change: false

