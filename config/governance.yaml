semantic_relationships:
  - subject: governance_target
    predicate: defines
    object: target_characteristics
  - subject: governance_target
    predicate: composed_of
    object: governance_capabilities
  - subject: governance_operating_model
    predicate: assigns
    object: governance_roles_and_bodies
  - subject: governance_capability
    predicate: enabled_by
    object: artifacts_controls_roles_tools_and_actions
  - subject: risk
    predicate: treated_by
    object: controls_and_actions
  - subject: control
    predicate: implemented_by
    object: roles_processes_and_tools
  - subject: governance_assessment
    predicate: evaluates
    object: targets_capabilities_risks_and_controls
  - subject: governance_finding
    predicate: supported_by
    object: source_and_evidence_references
  - subject: governance_action
    predicate: closes
    object: approved_findings_and_target_gaps
  - subject: governance_tool_requirement
    predicate: supports
    object: capabilities_controls_and_evidence

evidence_rules:
  current_state_claims_require_source_ids: true
  target_state_recommendations_require_rationale: true
  gaps_require_current_and_target_references: true
  actions_require_approved_gap_or_finding: true
  tool_selection_is_out_of_scope_until_requirements_are_approved: true
  source_derived_records_remain_proposed_until_human_review: true
