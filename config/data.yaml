evidence_and_control_rules:
  current_state_and_quality_claims_require_source_ids: true
  data_readiness_conclusions_require_assessment_and_findings: true
  data_product_registration_does_not_imply_access_or_AI_use_approval: true
  quality_thresholds_require_use_case_context_and_owner_review: true
  data_governance_requirements_do_not_approve_policy_or_controls: true
  security_privacy_and_rights_checks_require_owning_domain_review: true
  observability_checks_do_not_replace_incident_or_risk_decisions: true
  actions_require_approved_findings: true
  source_derived_records_remain_proposed_until_human_review: true
