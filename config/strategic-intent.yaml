  - transformation_thesis
  - business_problem_definition
  - vision_and_target_state
  - guiding_principles
  - strategic_choices_and_tradeoffs
  - assumptions_and_hypotheses
  - scenarios_and_uncertainties
  - strategic_objectives_and_outcomes
  - critical_success_factors
  - metrics_indicators_and_guardrails
  - capabilities_and_prerequisites
