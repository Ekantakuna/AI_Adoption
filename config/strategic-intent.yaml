    object: strategy_simulation
  - subject: strategic_objective
    predicate: measured_by
    object: metrics_and_critical_success_factors
  - subject: decision_intelligence_target
    predicate: realizes
    object: transformation_thesis
  - subject: strategy_execution_plan
    predicate: implements
    object: strategy_through_initiatives_capabilities_and_actions
  - subject: strategy_assessment
    predicate: evaluates
    object: outcomes_indicators_assumptions_choices_and_execution
