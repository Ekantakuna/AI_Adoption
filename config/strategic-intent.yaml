schema_version: 1

model_status: proposed
human_review_required: true
source_evidence_required_for_current_state: true

provisional_user_direction:
  status: proposed
  origin: user_direction
  focus: generative_ai_led_business_transformation
  transformation_thesis:
    - success is business transformation rather than deployment of more AI models or tools
    - AI should improve how business problems are framed and how strategic options are created and evaluated
    - intelligent choice architectures should combine Generative AI and predictive AI to improve human decisions
    - learning loops should improve both outcomes and the decision environment itself
  target_system: decision_centric_intelligence_system
  target_properties:
    - formalized_business_semantics
    - transparent_human_override_and_escalation
    - multi_agent_orchestration
    - continuous_observability
    - outcome_linked_learning_loops

