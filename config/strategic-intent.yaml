evidence_rules:
  facts_require_source_ids: true
  strategic_choices_require_alternatives_and_rationale: true
  hypotheses_require_test_and_falsification_criteria: true
  simulation_outputs_are_not_facts: true
  objectives_require_outcome_metrics: true
  success_factors_require_indicators: true
  execution_plans_require_owners_milestones_dependencies_and_review_triggers: true
  changes_require_version_links_and_rationale: true
  source_derived_records_remain_proposed_until_human_review: true
