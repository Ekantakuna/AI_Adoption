schema_version: 1

project:
  id: AI-ADOPTION
  name: AI Adoption Outlook
  repository_type: github
  source_of_truth: markdown-and-yaml
  primary_repository_path: .

objectives:
  - establish the current state of AI adoption
  - define the target AI adoption state
  - define the transition pathway
  - maintain a traceable project knowledge base
  - support dynamic reporting and presentation generation
  - support an intelligence-choice and decision environment

status_values:
  - proposed
  - draft
  - in_review
  - approved
  - superseded
  - retired

confidence_values:
  - low
  - medium
  - high

classification_values:
  - public
  - internal
  - restricted
