name: Validate repository

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements-validation.txt
      - name: Validate schemas and governed records
        run: python scripts/validate_schemas.py
      - name: Validate source processing controls
        run: python scripts/validate_source_processing.py
      - name: Validate knowledge records
        run: python scripts/validate_knowledge.py
      - name: Validate Codex prompt library
        run: python scripts/validate_prompts.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
